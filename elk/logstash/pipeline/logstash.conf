input {
  beats {
    port => 5044
  }
  
  # HTTP input for custom logs
  http {
    port => 8080
    codec => json
  }
  
  # TCP input for syslog
  tcp {
    port => 5000
    type => syslog
  }
  
  # UDP input for syslog
  udp {
    port => 5000
    type => syslog
  }
}

filter {
  # Parse timestamp
  if [fields][log_type] == "application" {
    date {
      match => [ "timestamp", "ISO8601" ]
    }
  }
  
  # Add hostname if not present
  if ![host][name] {
    mutate {
      add_field => { "[host][name]" => "%{[agent][hostname]}" }
    }
  }
  
  # Parse JSON logs
  if [message] =~ /^\{.*\}$/ {
    json {
      source => "message"
    }
  }
  
  # Grok patterns for common log formats
  if [fields][log_type] == "nginx" {
    grok {
      match => { "message" => "%{NGINXACCESS}" }
    }
  }
  
  # Add environment tag
  mutate {
    add_tag => [ "cloudwatch-monitoring" ]
    add_field => { "environment" => "production" }
  }
  
  # Remove unnecessary fields
  mutate {
    remove_field => [ "[agent][ephemeral_id]", "[agent][id]", "[ecs][version]" ]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    user => "elastic"
    password => "${ELASTICSEARCH_PASSWORD}"
    index => "cloudwatch-logs-%{+YYYY.MM.dd}"
    template_name => "cloudwatch-template"
    template_pattern => "cloudwatch-*"
    template => {
      "index_patterns" => ["cloudwatch-*"]
      "settings" => {
        "number_of_shards" => 1
        "number_of_replicas" => 0
        "index.refresh_interval" => "5s"
      }
      "mappings" => {
        "properties" => {
          "@timestamp" => { "type" => "date" }
          "message" => { "type" => "text" }
          "level" => { "type" => "keyword" }
          "host" => {
            "properties" => {
              "name" => { "type" => "keyword" }
              "ip" => { "type" => "ip" }
            }
          }
        }
      }
    }
  }
  
  # Debug output
  stdout {
    codec => rubydebug
  }
}
