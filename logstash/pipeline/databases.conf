# Simple Logstash Configuration for Testing
# Không có filter phức tạp, chỉ basic processing

input {
  # Beats input for Metricbeat (re-enabled)
  beats {
    port => 5044
    host => "0.0.0.0"
  }
  
  # HTTP input for direct log submission
  http {
    port => 8090
    host => "0.0.0.0"
    codec => json
  }
  
  # TCP input for application logs
  tcp {
    port => 5001
    codec => json_lines
  }
}

filter {
  # Add timestamp if missing
  if ![timestamp] {
    mutate {
      add_field => { "timestamp" => "%{@timestamp}" }
    }
  }
  
  # Parse timestamp
  date {
    match => [ "timestamp", "ISO8601", "yyyy-MM-dd HH:mm:ss", "yyyy-MM-dd'T'HH:mm:ss.SSSZ" ]
    target => "@timestamp"
  }

  # Apply database filtering for metricbeat data
  if [agent][type] == "metricbeat" {
    ruby {
      init => "
        require 'yaml'
        begin
          @@filter_rules = YAML.load_file('/usr/share/logstash/config-custom/database-filter-rules.yml')
          @@blocked_count = 0
          @@allowed_count = 0
        rescue => e
          logger.error('Failed to load filter rules', :error => e.message)
          @@filter_rules = {'global' => {'enabled' => false}}
        end
      "
      code => "
        rules = @@filter_rules

        # Check if filtering is enabled globally
        if !rules['global'] || !rules['global']['enabled']
          event.set('filter_status', 'bypassed')
          next
        end

        # Get metricset info
        service_type = event.get('[service][type]')
        metricset_name = event.get('[metricset][name]')

        # Initialize filter result
        # WHITELIST MODE: block by default if default_action is 'deny'
        default_action = rules['global']['default_action'] || 'allow'
        should_block = (default_action == 'deny')
        block_reasons = []
        removed_fields = []

        # If default is deny, we need explicit allow
        if default_action == 'deny'
          block_reasons << 'default_deny_policy'
        end

        # MySQL filtering
        if service_type == 'mysql' && rules['mysql'] && rules['mysql']['enabled']
          mysql_rules = rules['mysql']

          # WHITELIST: Check if metricset is explicitly allowed
          if mysql_rules['allowed_metricsets'] && !mysql_rules['allowed_metricsets'].empty?
            if mysql_rules['allowed_metricsets'].include?(metricset_name)
              # Metricset is allowed, remove default deny
              should_block = false
              block_reasons.delete('default_deny_policy')
            else
              # Metricset not in whitelist
              should_block = true
              block_reasons << 'metricset_not_in_whitelist:' + metricset_name
            end
          end

          # Check explicitly blocked metricsets
          if mysql_rules['blocked_metricsets'] && mysql_rules['blocked_metricsets'].include?(metricset_name)
            should_block = true
            block_reasons << 'explicitly_blocked_metricset:' + metricset_name
          end

          # Check required fields (only if not already blocked)
          if !should_block && mysql_rules['required_fields']
            mysql_rules['required_fields'].each do |field|
              if !event.get(field)
                should_block = true
                block_reasons << 'missing_required_field:' + field
              end
            end
          end

          # Check blocked fields and remove them (only if not blocked)
          if !should_block && mysql_rules['field_filters'] && mysql_rules['field_filters']['blocked_fields']
            mysql_rules['field_filters']['blocked_fields'].each do |pattern|
              if pattern.include?('*')
                # Wildcard pattern - skip for now to avoid complexity
              else
                # Exact field name
                field_path = '[' + pattern.gsub('.', '][') + ']'
                if event.get(field_path)
                  event.remove(field_path)
                  removed_fields << pattern
                end
              end
            end
          end

          # Check value limits for connections (only if not blocked)
          if !should_block && metricset_name == 'status'
            connections = event.get('[mysql][status][connections]')
            if connections && mysql_rules['value_limits'] && mysql_rules['value_limits']['connections']
              max_conn = mysql_rules['value_limits']['connections']['max']
              if connections > max_conn
                should_block = true
                block_reasons << 'connection_limit_exceeded'
              end
            end
          end
        end

        # PostgreSQL filtering
        if service_type == 'postgresql' && rules['postgresql'] && rules['postgresql']['enabled']
          pg_rules = rules['postgresql']

          # WHITELIST: Check if metricset is explicitly allowed
          if pg_rules['allowed_metricsets'] && !pg_rules['allowed_metricsets'].empty?
            if pg_rules['allowed_metricsets'].include?(metricset_name)
              should_block = false
              block_reasons.delete('default_deny_policy')
            else
              should_block = true
              block_reasons << 'metricset_not_in_whitelist:' + metricset_name
            end
          end

          # Check explicitly blocked metricsets
          if pg_rules['blocked_metricsets'] && pg_rules['blocked_metricsets'].include?(metricset_name)
            should_block = true
            block_reasons << 'explicitly_blocked_metricset:' + metricset_name
          end

          # Check required fields (only if not already blocked)
          if !should_block && pg_rules['required_fields']
            pg_rules['required_fields'].each do |field|
              if !event.get(field)
                should_block = true
                block_reasons << 'missing_required_field:' + field
              end
            end
          end

          # Block query field if it contains sensitive data (only if not blocked)
          if !should_block
            query = event.get('[postgresql][activity][query]')
            if query && rules['content_filters'] && rules['content_filters']['enabled']
              rules['content_filters']['sensitive_patterns'].each do |pattern|
                if query.match(/#{pattern}/)
                  event.remove('[postgresql][activity][query]')
                  removed_fields << 'postgresql.activity.query'
                  event.set('query_blocked_reason', 'sensitive_content')
                  break
                end
              end
            end
          end
        end

        # Elasticsearch filtering
        if service_type == 'elasticsearch' && rules['elasticsearch'] && rules['elasticsearch']['enabled']
          es_rules = rules['elasticsearch']

          # WHITELIST: Check if metricset is explicitly allowed
          if es_rules['allowed_metricsets'] && !es_rules['allowed_metricsets'].empty?
            if es_rules['allowed_metricsets'].include?(metricset_name)
              should_block = false
              block_reasons.delete('default_deny_policy')
            else
              should_block = true
              block_reasons << 'metricset_not_in_whitelist:' + metricset_name
            end
          end

          # Check explicitly blocked metricsets
          if es_rules['blocked_metricsets'] && es_rules['blocked_metricsets'].include?(metricset_name)
            should_block = true
            block_reasons << 'explicitly_blocked_metricset:' + metricset_name
          end
        end

        # Handle unknown service types (not in rules)
        if !['mysql', 'postgresql', 'elasticsearch'].include?(service_type)
          should_block = true
          block_reasons << 'unknown_service_type:' + service_type.to_s
        end

        # Apply decision
        if should_block
          event.set('filter_status', 'blocked')
          event.set('block_reasons', block_reasons)
          event.tag('_filtered_blocked')
          @@blocked_count += 1
        else
          event.set('filter_status', 'allowed')
          event.tag('_filtered_allowed')
          @@allowed_count += 1
        end

        # Add removed fields info
        if !removed_fields.empty?
          event.set('removed_fields', removed_fields)
        end

        # Add processing metadata
        event.set('filter_processed_at', Time.now.utc.iso8601)
        event.set('filter_stats', {
          'blocked_count' => @@blocked_count,
          'allowed_count' => @@allowed_count
        })
      "
    }

    # Tag blocked events for separate routing
    if "blocked" in [filter_status] {
      mutate {
        add_tag => ["_send_to_blocked_index"]
      }
    }
  }

  # Add basic metadata
  mutate {
    add_field => {
      "processed_by" => "logstash_unified"
      "pipeline" => "main"
    }
  }
}

output {
  # Route blocked events to block-metric index
  if "_send_to_blocked_index" in [tags] {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      user => "${ELASTIC_USERNAME:elastic}"
      password => "${ELASTIC_PASSWORD:changeme123}"
      index => "block-metric-%{+YYYY.MM.dd}"
      action => "create"
    }
  } else {
    # Allowed events to metricbeat-filtered index
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      user => "${ELASTIC_USERNAME:elastic}"
      password => "${ELASTIC_PASSWORD:changeme123}"
      index => "metricbeat-filtered-%{+YYYY.MM.dd}"
      action => "create"
    }
  }

  # Debug output (always enabled for testing)
  stdout {
    codec => rubydebug
  }
}
