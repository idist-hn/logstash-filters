# Logstash Multiple Pipelines Configuration
# Cấu hình nhiều pipeline để xử lý các loại dữ liệu khác nhau

# Single unified pipeline for all inputs (Beats, TCP, HTTP)
- pipeline.id: main
  path.config: "/usr/share/logstash/pipeline/simple.conf"
  pipeline.workers: 2
  pipeline.batch.size: 500
  pipeline.batch.delay: 50
  queue.type: memory
  queue.max_events: 2000
  queue.max_bytes: 2gb

