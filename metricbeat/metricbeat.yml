metricbeat.config.modules:
  path: ${path.config}/modules.d/*.yml
  reload.enabled: false

# System module
metricbeat.modules:
- module: system
  metricsets:
    - cpu
    - load
    - memory
    - network
    - process
    - process_summary
    - core
    - diskio
  enabled: true
  period: 10s
  processes: ['.*']
  cpu.metrics:  ["percentages", "normalized_percentages"]
  core.metrics: ["percentages"]

- module: docker
  metricsets:
    - container
    - cpu
    - diskio
    - event
    - healthcheck
    - info
    - image
    - memory
    - network
  hosts: ["unix:///var/run/docker.sock"]
  period: 10s
  enabled: true

- module: elasticsearch
  metricsets:
    - node
    - node_stats
    - cluster_stats
    - index
    - index_recovery
    - index_summary
    - shard
    - ml_job
  period: 10s
  hosts: ["http://elasticsearch:9200"]
  username: "elastic"
  password: "${ELASTICSEARCH_PASSWORD}"
  enabled: true

- module: kibana
  metricsets:
    - status
    - stats
  period: 10s
  hosts: ["http://kibana:5601"]
  username: "elastic"
  password: "${ELASTICSEARCH_PASSWORD}"
  enabled: true

- module: logstash
  metricsets:
    - node
    - node_stats
  period: 10s
  hosts: ["http://logstash:9600"]
  enabled: true

