# Processors
processors:
  - add_host_metadata:
      when.not.contains.tags: forwarded
  - add_cloud_metadata: ~
  - add_docker_metadata: ~
  - add_kubernetes_metadata: ~

# Output configuration - Send to Logstash for filtering
output.logstash:
  hosts: ["logstash:5044"]

# Alternative: Direct to Elasticsearch (disabled)
